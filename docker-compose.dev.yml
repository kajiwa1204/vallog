services:
  nginx:
    profiles:
      - production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-claude}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PR_SUMMARY_MODEL: ${OPENAI_PR_SUMMARY_MODEL:-qwen3:8b}
      OPENAI_MEMBER_SUMMARY_MODEL: ${OPENAI_MEMBER_SUMMARY_MODEL:-qwen3:8b}

  db:
    ports:
      - "5432:5432"
