services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE_URL=
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - FASTAPI_ROOT_PATH=/api
      # 空文字は bool | None のパースに失敗するため、必ず既定値付きで渡す。
      # 本番は FRONTEND_URL の設定ミスで平文Cookieになるのを防ぐため true に倒す
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - AUTH_COOKIE_PATH=${AUTH_COOKIE_PATH:-/api/auth}
      - GITHUB_CACHE_TTL_SECONDS=${GITHUB_CACHE_TTL_SECONDS:-300}
      - SUMMARY_PROVIDER=${SUMMARY_PROVIDER:-claude}
      - PR_DIFF_CHAR_LIMIT=${PR_DIFF_CHAR_LIMIT:-30000}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CLAUDE_PR_MODEL=${CLAUDE_PR_MODEL:-claude-haiku-4-5-20251001}
      - CLAUDE_MEMBER_MODEL=${CLAUDE_MEMBER_MODEL:-claude-haiku-4-5-20251001}
      - CLAUDE_PR_CONCURRENCY=${CLAUDE_PR_CONCURRENCY:-5}
      - CLAUDE_MEMBER_CONCURRENCY=${CLAUDE_MEMBER_CONCURRENCY:-3}
      - CLAUDE_THINKING_BUDGET_TOKENS=${CLAUDE_THINKING_BUDGET_TOKENS:-1024}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_PR_MODEL=${OPENAI_PR_MODEL:-gpt-5-nano}
      - OPENAI_MEMBER_MODEL=${OPENAI_MEMBER_MODEL:-gpt-5-nano}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-minimal}
      - OPENAI_PR_CONCURRENCY=${OPENAI_PR_CONCURRENCY:-5}
      - OPENAI_MEMBER_CONCURRENCY=${OPENAI_MEMBER_CONCURRENCY:-3}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      - OLLAMA_PR_MODEL=${OLLAMA_PR_MODEL:-qwen3:4b-instruct}
      - OLLAMA_MEMBER_MODEL=${OLLAMA_MEMBER_MODEL:-qwen3:4b-instruct}
      - OLLAMA_PR_CONCURRENCY=${OLLAMA_PR_CONCURRENCY:-2}
      - OLLAMA_MEMBER_CONCURRENCY=${OLLAMA_MEMBER_CONCURRENCY:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
